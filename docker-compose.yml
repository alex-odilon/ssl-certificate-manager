services:
  postgres:
    container_name: sslmanager-postgres
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sslmanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sslmanager123}
      POSTGRES_DB: ${POSTGRES_DB:-sslmanager}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - sslmanager-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sslmanager}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    container_name: sslmanager-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sslmanager}:${POSTGRES_PASSWORD:-sslmanager123}@postgres:5432/${POSTGRES_DB:-sslmanager}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-here-change-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sslmanager.local}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    volumes:
      - ./backend:/app
      - ssl_files:/app/ssl_files
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sslmanager-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    container_name: sslmanager-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - sslmanager-network
    environment:
      - REACT_APP_API_URL=http://localhost:8000

volumes:
  postgres_data:
  ssl_files:


networks:
  sslmanager-network:
    driver: bridge
